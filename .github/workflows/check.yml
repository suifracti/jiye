name: Check catalog
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bundled offline dependencies
        run: python3 -m pip install --no-index tools/vendor/*.whl
      - name: Check source and complete history
        run: python3 -I tools/check_clean.py
      - name: Offline tests, 2000 synthetic records, build and decoded artifact scans
        run: python3 -I tools/check_release.py --build
